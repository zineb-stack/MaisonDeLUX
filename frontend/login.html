<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaisonLux Maroc — Connexion</title>
<style>
  :root{
    --blue:#2A5DB0;
    --blue-dark:#1B3F80;
    --blue-light:#5C87D6;
    --ink:#14161A;
    --gray:#6B7280;
    --gray-light:#9CA3AF;
    --bg:#FFFFFF;
    --bg-soft:#F5F7FB;
    --line:rgba(20,22,26,0.09);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font); color:var(--ink); background:var(--bg); line-height:1.5; }

  header.nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 6vw;
    border-bottom:1px solid var(--line);
  }
  .nav-logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; text-decoration:none; color:var(--ink); }
  .nav-logo svg{ width:34px; height:34px; }
  .nav-back{ font-size:14px; font-weight:600; color:var(--gray); text-decoration:none; }
  .nav-back:hover{ color:var(--ink); }

  .auth-wrap{
    min-height:calc(100vh - 66px);
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
    position:relative; overflow:hidden;
  }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.28; z-index:0; }
  .blob-1{ width:380px; height:380px; background:var(--blue); top:-140px; left:-100px; }
  .blob-2{ width:320px; height:320px; background:#7BA8E8; bottom:-120px; right:-100px; opacity:0.24; }

  .auth-card{
    position:relative; z-index:1;
    background:#fff; border:1px solid var(--line); border-radius:20px;
    padding:40px; width:100%; max-width:400px;
    box-shadow:0 20px 50px rgba(20,22,26,0.08);
  }
  .auth-card h1{ font-size:24px; font-weight:800; margin-bottom:6px; }
  .auth-card .subtitle{ font-size:13.5px; color:var(--gray); margin-bottom:28px; }

  .field{ margin-bottom:18px; display:flex; flex-direction:column; gap:6px; }
  .field-header{ display:flex; justify-content:space-between; align-items:baseline; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .forgot-link{ font-size:12px; color:var(--blue); font-weight:600; text-decoration:none; }
  .forgot-link:hover{ text-decoration:underline; }
  .field input{
    padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg-soft); font-size:15px; color:var(--ink);
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ outline:none; border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(42,93,176,0.14); }

  .cta{
    width:100%; padding:13px; background:var(--blue); color:#fff; border:none;
    border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; margin-top:4px;
    box-shadow:0 8px 20px rgba(42,93,176,0.25);
    transition:background .15s ease;
  }
  .cta:hover{ background:var(--blue-dark); }

  .divider{ display:flex; align-items:center; text-align:center; color:var(--gray); font-size:12px; margin:22px 0; }
  .divider::before, .divider::after{ content:""; flex:1; border-bottom:1px solid var(--line); }
  .divider span{ padding:0 12px; }

  .cta-outline{
    width:100%; padding:12px; background:transparent; color:var(--ink);
    border:1.5px solid var(--line); border-radius:10px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .cta-outline:hover{ border-color:var(--ink); }

  .hint{ text-align:center; font-size:13px; margin-top:22px; color:var(--gray); }
  .hint a{ color:var(--blue); font-weight:700; text-decoration:none; }
  .hint a:hover{ text-decoration:underline; }
</style>
</head>
<body>

  <header class="nav">
    <a href="site.html" class="nav-logo">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="9" fill="#F5F7FB"/>
        <g stroke="#2A5DB0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 22L20 13L30 22"/>
          <path d="M13 20V29"/>
          <path d="M27 20V29"/>
          <path d="M13 29H27"/>
          <rect x="16" y="22" width="3.6" height="3.6"/>
          <path d="M23 29V24.3H26.6V29"/>
          <path d="M9 31H31"/>
        </g>
      </svg>
      MaisonLux
    </a>
    <a href="site.html" class="nav-back">← Retour au site</a>
  </header>

  <main class="auth-wrap">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="auth-card">
      <h1>Connexion</h1>
      <p class="subtitle">Accédez à vos estimations et vos biens favoris.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Adresse email</label>
          <input type="email" id="email" placeholder="vous@exemple.com" required>
        </div>

        <div class="field">
          <div class="field-header">
            <label for="password">Mot de passe</label>
            <a href="#" class="forgot-link">Oublié ?</a>
          </div>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="cta">Continuer</button>
      </form>

      <div class="divider"><span>ou</span></div>

      <button id="guestBtn" class="cta-outline">Continuer sans compte</button>

      <p class="hint">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
    </div>
  </main>

<script>
  const API_URL = 'http://localhost:5000/api/login/';

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email || !password){ alert("Merci de remplir tous les champs."); return; }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalLabel = submitBtn.textContent;
    submitBtn.textContent = 'Connexion...';
    submitBtn.disabled = true;

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!res.ok){
        alert(data.error || "Erreur de connexion.");
        return;
      }
      localStorage.setItem('maisonlux_user', JSON.stringify(data));
      window.location.href = "site.html";
    } catch(err){
      alert("Impossible de contacter le serveur. Vérifiez que le backend (python app.py) est bien lancé.");
    } finally {
      submitBtn.textContent = originalLabel;
      submitBtn.disabled = false;
    }
  });

  document.getElementById('guestBtn').addEventListener('click', function(){
    window.location.href = "site.html#estimation";
  });
</script>

</body>
</html>
